name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-secret-nao-usar-em-producao"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client e criar banco
        run: |
          npx prisma generate
          npx prisma db push

      - name: Rodar lint
        run: npm run lint

      - name: Rodar testes unitários
        run: npm run test

      - name: Build de produção
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test

    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-secret-nao-usar-em-producao"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client, banco e seed
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        run: npm run test:e2e
